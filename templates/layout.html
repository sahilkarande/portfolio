{% include 'loader.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Explore Sahil Karande's portfolio including Data Science projects, Web Development, certifications, and insightful Medium blogs.">
  <meta name="keywords" content="Sahil Karande, Blogs, Data Science, Web Development, CDAC, Python, Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/blog.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/loader.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/project.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='assets/images/clipboard.ico') }}" type="image/x-icon">
  <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.ico') }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-gradient-start: #0f0c29;
      --bg-gradient-mid: #302b63;
      --bg-gradient-end: #24243e;
      --card-bg: rgba(30, 32, 34, 0.95);
      --navbar-bg: rgba(44, 47, 51, 0.98);
      --accent-primary: #ffdb70;
      --accent-secondary: #fcca64;
      --text-primary: #f3f3f3;
      --text-secondary: #bdbdbd;
      --shadow-primary: rgba(0, 0, 0, 0.3);
      --shadow-glow: rgba(255, 219, 112, 0.15);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background particles */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 219, 112, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(252, 202, 100, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    main {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .main-content {
      flex: 1;
      
      padding: 2.5rem;
      background: linear-gradient(135deg, 
        rgba(30, 32, 34, 0.97) 0%, 
        rgba(36, 37, 38, 0.95) 50%, 
        rgba(30, 32, 34, 0.97) 100%
      );
      min-height: 100vh;
      border-radius: 32px 0 0 32px;
      box-shadow: 
        -8px 0 40px var(--shadow-primary),
        inset 0 0 100px rgba(255, 219, 112, 0.02);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(15px);
      position: relative;
      overflow-x: hidden;
    }

    .main-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 219, 112, 0.3) 50%, 
        transparent 100%
      );
      opacity: 0.6;
    }

    .main-content::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, 
        transparent 0%, 
        rgba(255, 219, 112, 0.1) 50%, 
        transparent 100%
      );
    }

    /* Navigation Bar */
    .navbar {
      background: var(--navbar-bg);
      border-radius: 20px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky;
      top: -0rem;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .navbar:hover {
      box-shadow: 0 8px 32px rgba(255, 219, 112, 0.1);
    }

    .navbar-content {
      width: 100%;
    }

    .navbar-list {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }

    .navbar-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      overflow: hidden;
    }

    .navbar-link i {
      font-size: 1rem;
      transition: transform 0.3s ease;
    }

    .navbar-link::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 12px;
      z-index: -1;
    }

    .navbar-link.active,
    .navbar-link:hover {
      color: #000;
      transform: translateY(-2px);
    }

    .navbar-link.active::before,
    .navbar-link:hover::before {
      opacity: 1;
    }

    .navbar-link:hover i {
      transform: scale(1.1) rotate(5deg);
    }

    /* Page Section */
    .page-section {
      background: rgba(36, 37, 38, 0.6);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
      margin-top: 0.5rem;
      min-height: 70vh;
      animation: fadeInUp 0.6s ease-out;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    @keyframes fadeInUp {
      from { 
        opacity: 0; 
        transform: translateY(30px);
      }
      to { 
        opacity: 1; 
        transform: translateY(0);
      }
    }

    /* Social Bar */
    .social-bar {
      position: fixed;
      top: 50%;
      left: 1.5rem;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .social-bar a {
      color: var(--accent-primary);
      background: rgba(35, 37, 38, 0.95);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      border: 2px solid transparent;
      backdrop-filter: blur(10px);
    }

    .social-bar a:hover {
      background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
      color: #000;
      transform: scale(1.15) rotate(5deg);
      box-shadow: 0 6px 24px var(--shadow-glow);
      border-color: var(--accent-primary);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(35, 37, 38, 0.5);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
      border-radius: 10px;
      border: 2px solid rgba(35, 37, 38, 0.5);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .main-content {
        margin-left: 0;
        border-radius: 0;
        padding: 2.5rem 2rem;
        padding-top: 1.5rem;
      }

      .navbar {
        top: 1.5rem;
        margin-bottom: 2rem;
        padding: 1.25rem 1.5rem;
      }

      .navbar-list {
        gap: 0.75rem;
      }

      .navbar-link {
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
        gap: 0.6rem;
      }

      .navbar-link i {
        font-size: 1.2rem;
      }

      .page-section {
        padding: 2rem;
        font-size: 1.05rem;
      }

      .social-bar {
        left: auto;
        right: 1.5rem;
        top: auto;
        bottom: 1.5rem;
        transform: none;
        flex-direction: row;
        background: rgba(35, 37, 38, 0.95);
        padding: 1rem;
        border-radius: 50px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(20px);
      }

      .social-bar a {
        width: 52px;
        height: 52px;
        font-size: 1.3rem;
      }
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 2rem 1.5rem;
        padding-top: 1rem;
        padding-bottom: 6rem;
      }

      .navbar {
        border-radius: 18px;
        padding: 1rem;
        top: 1rem;
        margin-bottom: 1.5rem;
      }

      .navbar-list {
        gap: 0.5rem;
      }

      .navbar-link {
        padding: 0.9rem 1.2rem;
        font-size: 1rem;
        gap: 0.5rem;
      }

      .navbar-link i {
        font-size: 1.15rem;
      }

      .page-section {
        padding: 2rem 1.5rem;
        border-radius: 18px;
        min-height: 60vh;
        font-size: 1.05rem;
      }

      .social-bar {
        padding: 0.9rem;
        gap: 0.8rem;
        bottom: 1rem;
        right: 1rem;
      }

      .social-bar a {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
      }
    }

    @media (max-width: 580px) {
      .main-content {
        padding: 1.5rem 1rem;
        padding-top: 0.75rem;
        padding-bottom: 5.5rem;
      }

      .navbar {
        border-radius: 16px;
        padding: 0.75rem 0.5rem;
        top: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .navbar-list {
        gap: 0.4rem;
      }

      .navbar-link {
        padding: 0.75rem 0.8rem;
        font-size: 0.9rem;
        gap: 0.4rem;
        flex-direction: column;
        min-width: 50px;
      }

      .navbar-link i {
        font-size: 1.3rem;
      }

      .navbar-link span {
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .page-section {
        padding: 1.75rem 1.25rem;
        border-radius: 16px;
        font-size: 1rem;
      }

      .social-bar {
        padding: 0.75rem;
        gap: 0.7rem;
        bottom: 0.75rem;
        right: 0.75rem;
      }

      .social-bar a {
        width: 48px;
        height: 48px;
        font-size: 1.1rem;
      }
    }

    @media (max-width: 420px) {
      .main-content {
        padding: 1.25rem 0.75rem;
        padding-top: 0.5rem;
        padding-bottom: 5rem;
      }

      .navbar {
        border-radius: 14px;
        padding: 0.6rem 0.4rem;
        top: 0.5rem;
        margin-bottom: 1rem;
      }

      .navbar-list {
        gap: 0.3rem;
      }

      .navbar-link {
        padding: 0.7rem 0.5rem;
        font-size: 0.85rem;
        flex-direction: column;
        gap: 0.3rem;
        flex: 1;
        min-width: 0;
      }

      .navbar-link i {
        font-size: 1.2rem;
      }

      .navbar-link span {
        font-size: 0.7rem;
        white-space: nowrap;
      }

      .page-section {
        padding: 1.5rem 1rem;
        border-radius: 14px;
        font-size: 0.95rem;
      }

      .social-bar {
        padding: 0.65rem;
        gap: 0.6rem;
        bottom: 0.5rem;
        right: 0.5rem;
      }

      .social-bar a {
        width: 44px;
        height: 44px;
        font-size: 1rem;
      }
    }

    /* Smooth hover effects */
    @media (hover: hover) {
      .navbar-link,
      .social-bar a {
        position: relative;
      }

      .navbar-link::after,
      .social-bar a::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: radial-gradient(circle, var(--shadow-glow), transparent);
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
        pointer-events: none;
        z-index: -1;
      }

      .navbar-link:hover::after,
      .social-bar a:hover::after {
        width: 200%;
        height: 200%;
      }
    }

    /* Accessibility improvements */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Focus styles for keyboard navigation */
    .navbar-link:focus-visible,
    .social-bar a:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <main>

    <div class="main-content">

  <!-- External Scripts -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="{{ url_for('static', filename='assets/js/loader.js') }}"></script>
  <script src="{{ url_for('static', filename='static/assets/js/script.js') }}"></script>

  <script>
    // Smooth scroll behavior
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });

    // Add loading animation on page load
    window.addEventListener('load', () => {
      const pageSection = document.querySelector('.page-section');
      if (pageSection) {
        pageSection.style.opacity = '0';
        pageSection.style.transform = 'translateY(20px)';
        setTimeout(() => {
          pageSection.style.transition = 'all 0.6s ease-out';
          pageSection.style.opacity = '1';
          pageSection.style.transform = 'translateY(0)';
        }, 100);
      }
    });
  </script>
</body>
</html>
